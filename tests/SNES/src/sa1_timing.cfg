# ld65 layout for sa1_timing.s: 64 KiB, two 32 KiB LoROM-style banks (SA-1 map, default MMC).
MEMORY {
    ROM0: start = $008000, size = $8000, fill = yes, fillval = $00;
    ROM1: start = $018000, size = $8000, fill = yes, fillval = $00;
    WRAM: start = $001000, size = $0800, type = rw;
}
SEGMENTS {
    CODE:    load = ROM0, type = ro;
    MEASURE: load = ROM0, run = WRAM, type = rw, define = yes;
    HEADER:  load = ROM0, type = ro, start = $00FFC0;
    VECTORS: load = ROM0, type = ro, start = $00FFE0;
    BLOCKS:  load = ROM1, type = ro;
}
