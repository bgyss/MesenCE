[tasks."test:savestate-all"]
description = "Save-state round trip on every ROM in MesenTests (bin/Tests) and tests/, except GBA (needs the BIOS)"
depends = ["core"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -d bin/Tests ] || { echo "bin/Tests missing: run mise run test:ci once to clone MesenTests"; exit 1; }
python3 -I tools/savestate-roundtrip/extract-mtp-roms.py bin/savestate-roms bin/Tests tests
objdir=$(ls -d InteropDLL/obj.* | head -1)
lib=$(ls "$objdir"/MesenCore.* | head -1)
clang++ -std=c++17 -O2 -Wno-undefined-inline -I. -ICore -IUtilities tools/savestate-roundtrip/roundtrip.cpp "$lib" -pthread -o bin/savestate-roundtrip
export DYLD_FALLBACK_LIBRARY_PATH="$PWD/$objdir" LD_LIBRARY_PATH="$PWD/$objdir"
status=0
for sys in NES GB SNES SMS PCE WS; do
  [ -d "bin/savestate-roms/$sys" ] || continue
  echo "== $sys"
  bin/savestate-roundtrip "bin/savestate-roms/$sys" || status=1
done
exit $status
'''

[tasks.tla]
description = "Model-check the TLA+ specs in docs/research/tla (NES DMA: MC_*.cfg, GB IRQ: GbIrq_*.cfg)"
dir = "docs/research/tla"
run = '''
#!/usr/bin/env bash
set -uo pipefail
meta=$(mktemp -d)
trap 'rm -rf "$meta"' EXIT
check() { # <spec.tla> <configs...>
  local spec=$1; shift
  for cfg in "$@"; do
    case "$cfg" in
      *_prefix_*) echo "=== $spec / $cfg  (pre-fix code: a violation is EXPECTED)" ;;
      *) echo "=== $spec / $cfg" ;;
    esac
    tlc -config "$cfg" -workers auto -metadir "$meta/${cfg%.cfg}" "$spec" \
      | grep -E "^Error|No error has been found|distinct states found" || true
  done
}
check NesDmaScheduler.tla MC_*.cfg
check GbIrqStateMachine.tla GbIrq_*.cfg
'''

[tasks.format]
description = "Format C++ (clang-format) and C# (dotnet format)"
run = [
  "find . \\( -iname '*.h' -o -iname '*.cpp' \\) -not -path './bin/*' | xargs clang-format -i",
  "dotnet format",
]

[tasks.clean]
description = "Remove build outputs"
run = "make clean"
