# Toolchain comes from the Nix dev shell (flake.nix, loaded by direnv via .envrc).
# mise only holds project env vars and task shortcuts.

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tasks.build]
description = "Build native core + UI (Release)"
run = "make -j$(getconf _NPROCESSORS_ONLN)"

[tasks."build:debug"]
description = "Build native core + UI (Debug, -O0 -g)"
run = "make -j$(getconf _NPROCESSORS_ONLN) DEBUG=1"

[tasks."build:asan"]
description = "Debug build with AddressSanitizer"
run = "make -j$(getconf _NPROCESSORS_ONLN) DEBUG=1 SANITIZER=address"

[tasks.core]
description = "Build only the native core (MesenCore shared library)"
run = "make -j$(getconf _NPROCESSORS_ONLN) core"

[tasks."nix:core"]
description = "Hermetic Nix build of the native core (./result/lib)"
run = "nix build .#core -L"

[tasks.run]
description = "Run the built emulator (pass extra args after --)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
os=$(uname -s); arch=$(uname -m)
case "$os" in Darwin) plat=osx ;; *) plat=linux ;; esac
case "$arch" in x86_64) plat="$plat-x64" ;; *) plat="$plat-arm64" ;; esac
cfg=${MESEN_CONFIG:-Release}
pub="bin/$plat/$cfg/$plat/publish"
if [ -x "$pub/Mesen.app/Contents/MacOS/Mesen" ]; then exe="$pub/Mesen.app/Contents/MacOS/Mesen"; else exe="$pub/Mesen"; fi
[ -x "$exe" ] || { echo "Not built: $exe (run 'mise run build')" >&2; exit 1; }
# SDL2 (audio) is dlopen'd; point the loader at the Nix copy from the dev shell.
export DYLD_FALLBACK_LIBRARY_PATH="${MESEN_RUNTIME_LIBRARY_PATH:-}${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
export LD_LIBRARY_PATH="${MESEN_RUNTIME_LIBRARY_PATH:-}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
exec "$exe" "$@"
'''

[tasks.test]
description = "Headless Lua test: mise run test -- <script.lua> <rom> [--timeout=N]"
run = '''
#!/usr/bin/env bash
exec mise run run -- --testRunner "$@"
'''

[tasks."test:ci"]
description = "Run the MesenTests regression suite headlessly, like CI (clones into bin/Tests), then the fork's own tests/"
depends = ["core"]
run = '''
#!/usr/bin/env bash
set -uo pipefail
tests="$PWD/bin/Tests"
if [ -d "$tests/.git" ]; then git -C "$tests" pull --ff-only -q; else git clone --depth 1 https://github.com/nesdev-org/MesenTests.git "$tests"; fi
make pgohelper || exit 1
objdir=$(ls -d InteropDLL/obj.* | head -1)
helper="PGOHelper/${objdir#InteropDLL/}/pgohelper"
libs="$PWD/$objdir:${MESEN_RUNTIME_LIBRARY_PATH:-}"
export DYLD_FALLBACK_LIBRARY_PATH="$libs" LD_LIBRARY_PATH="$libs"
echo "== MesenTests (upstream, bin/Tests) =="
"$helper" "$tests" citests; upstream=$?
echo "== Fork tests (tests/) =="
"$helper" "$PWD/tests" citests; fork=$?
echo "upstream: $([ $upstream -eq 0 ] && echo pass || echo FAIL), fork: $([ $fork -eq 0 ] && echo pass || echo FAIL)"
[ $upstream -eq 0 ] && [ $fork -eq 0 ]
'''

[tasks."build:test-roms"]
description = "Build the fork's test ROMs (tests/<system>/src) into bin/test-roms"
run = "tests/tools/build-roms.sh"

[tasks."test:record"]
description = "Record a .mtp test headlessly and check that it replays (mise run test:record -- <rom> <out.mtp> [--frames N])"
depends = ["core"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
objdir=$(ls -d InteropDLL/obj.* | head -1)
lib=$(ls "$objdir"/MesenCore.* | head -1)
mkdir -p bin
clang++ -std=c++17 -O2 -Wno-undefined-inline -I. -ICore -IUtilities tools/mtp-record/record.cpp "$lib" -pthread -o bin/mtp-record
export DYLD_FALLBACK_LIBRARY_PATH="$PWD/$objdir:${MESEN_RUNTIME_LIBRARY_PATH:-}" LD_LIBRARY_PATH="$PWD/$objdir:${MESEN_RUNTIME_LIBRARY_PATH:-}"
exec bin/mtp-record "$@"
'''

[tasks."test:record-fork"]
description = "Rebuild the fork's test ROMs and re-record every test in tests/manifest.txt"
depends = ["core", "build:test-roms"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
objdir=$(ls -d InteropDLL/obj.* | head -1)
lib=$(ls "$objdir"/MesenCore.* | head -1)
clang++ -std=c++17 -O2 -Wno-undefined-inline -I. -ICore -IUtilities tools/mtp-record/record.cpp "$lib" -pthread -o bin/mtp-record
export DYLD_FALLBACK_LIBRARY_PATH="$PWD/$objdir:${MESEN_RUNTIME_LIBRARY_PATH:-}" LD_LIBRARY_PATH="$PWD/$objdir:${MESEN_RUNTIME_LIBRARY_PATH:-}"
grep -v '^#' tests/manifest.txt | while read -r mtp rom frames; do
  [ -n "$mtp" ] || continue
  bin/mtp-record "bin/test-roms/$rom" "tests/$mtp" --frames "$frames"
done
'''

[tasks."test:cpu"]
description = "NES CPU vs SingleStepTests nes6502 (mise run test:cpu -- [--details N] [opcode files...])"
depends = ["core"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
data="$PWD/bin/SingleStepTests-65x02"
if [ ! -d "$data/nes6502" ]; then
  git clone --depth 1 --filter=blob:none --sparse https://github.com/SingleStepTests/65x02.git "$data"
  git -C "$data" sparse-checkout set nes6502
fi
objdir=$(ls -d InteropDLL/obj.* | head -1)
lib=$(ls "$objdir"/MesenCore.* | head -1)
mkdir -p bin
clang++ -std=c++17 -O2 -Wno-undefined-inline -I. -ICore -IUtilities tools/nes-cpu-singlestep/singlestep.cpp "$lib" -pthread -o bin/nes-cpu-singlestep
export DYLD_FALLBACK_LIBRARY_PATH="$PWD/$objdir" LD_LIBRARY_PATH="$PWD/$objdir"
havePath=0
for a in "$@"; do [ -e "$a" ] && havePath=1; done
if [ $havePath -eq 0 ]; then set -- "$@" "$data/nes6502/v1"; fi
exec bin/nes-cpu-singlestep "$@"
'''

