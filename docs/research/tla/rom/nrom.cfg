# ld65 config: NROM-128 (16 KB PRG at $C000, 8 KB CHR)
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    PRG:    start = $C000, size = $4000, type = ro, fill = yes, fillval = $00;
    CHR:    start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    CODE:     load = PRG, type = ro, start = $C100;  # $C000-$C0FF: DMC sample (zeros)
    VECTORS:  load = PRG, type = ro, start = $FFFA;
}
